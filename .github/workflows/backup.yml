name: Backup database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout backups branch
        run: |
          git clone --depth 1 --branch backups "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo 2>/dev/null || (
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo &&
            cd repo &&
            git checkout --orphan backups &&
            git rm -rf . 2>/dev/null || true
          )

      - name: Export data via Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm install @supabase/supabase-js --no-save --no-audit --no-fund
          node -e '
            const { createClient } = require("@supabase/supabase-js");
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
            (async () => {
              const tabelle = ["oggetti", "movimenti", "impostazioni"];
              const dump = {};
              for (const tabella of tabelle) {
                const { data, error } = await supabase.from(tabella).select("*");
                if (error) throw error;
                dump[tabella] = data;
              }
              require("fs").writeFileSync("dump.json", JSON.stringify(dump, null, 2));
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      - name: Encrypt and save backup
        run: |
          mkdir -p repo/backups
          echo "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" | gpg --batch --yes --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            -o "repo/backups/backup-$(date +%F).json.gpg" "dump.json"
          rm -f dump.json

      - name: Commit and push
        run: |
          cd repo
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          git commit -m "Backup $(date +%F)" || echo "Nessuna modifica da salvare"
          git push origin backups
